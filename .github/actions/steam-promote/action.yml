name: Steam promote
description: >-
  Ask Steam to set an already-resolved build live on the DEFAULT branch. Shared
  by release.yml (at promotion time) and steam-promote.yml (dispatch + scheduled
  retry) so the request and its failure handling cannot drift apart.

  Success here means Steam ACCEPTED the request. Assigning a build to the
  default branch of a released app returns HTTP 201 and pushes a confirmation
  to the approver's Steam Mobile app; the build is not live until that is
  tapped. Use GetAppBetas to find out whether it actually went live.

inputs:
  publisher-api-key:
    description: Publisher Web API key with Edit App + Publish.
    required: true
  steamid:
    description: SteamID64 that receives the Steam Mobile confirmation prompt.
    required: true
  app-id:
    description: Steam app id.
    required: true
  build-id:
    description: Steam build id to set live (from the steam-build-id action).
    required: true
  version:
    description: Version string without the leading v, e.g. 1.0.37.
    required: true
  restricted-is-failure:
    description: >-
      What to do when Steam refuses because the approver account has a recent
      security event. 'true' fails the step (a human asked for this now and
      wants to see it fail). 'false' warns and succeeds, for scheduled retries
      that should stay quiet until the restriction lifts.
    required: false
    default: 'true'

outputs:
  outcome:
    description: requested (201) | applied (200) | restricted (403, tolerated)
    value: ${{ steps.promote.outputs.outcome }}

runs:
  using: composite
  steps:
    - id: promote
      shell: bash
      env:
        STEAM_PUBLISHER_API_KEY: ${{ inputs.publisher-api-key }}
        STEAM_PUBLISH_STEAMID: ${{ inputs.steamid }}
        APP_ID: ${{ inputs.app-id }}
        BUILD_ID: ${{ inputs.build-id }}
        VERSION: ${{ inputs.version }}
        RESTRICTED_IS_FAILURE: ${{ inputs.restricted-is-failure }}
      run: |
        set -euo pipefail

        if [ -z "${STEAM_PUBLISHER_API_KEY:-}" ] || [ -z "${STEAM_PUBLISH_STEAMID:-}" ]; then
          echo "::error::STEAM_PUBLISHER_API_KEY and STEAM_PUBLISH_STEAMID must both be set (publisher Web API key with Edit App + Publish, and the SteamID64 that should receive the confirmation prompt)."
          exit 1
        fi

        echo "Requesting promotion of Steam build $BUILD_ID (v$VERSION) to the default branch"

        # betakey=public is the DEFAULT branch. `default` is not a valid value.
        # steamid is required whenever a released app's betakey is public.
        http_code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
          "https://partner.steam-api.com/ISteamApps/SetAppBuildLive/v2/" \
          --data-urlencode "key=$STEAM_PUBLISHER_API_KEY" \
          --data-urlencode "appid=$APP_ID" \
          --data-urlencode "buildid=$BUILD_ID" \
          --data-urlencode "betakey=public" \
          --data-urlencode "steamid=$STEAM_PUBLISH_STEAMID" \
          --data-urlencode "description=v$VERSION")

        cat response.json
        steam_message=$(jq -r '.response.message // ""' response.json 2>/dev/null || true)

        case "$http_code" in
          201)
            echo "outcome=requested" >> "$GITHUB_OUTPUT"
            {
              echo "### Steam promotion requested — action needed"
              echo ""
              echo "Build \`$BUILD_ID\` (v$VERSION) is queued for the **default** branch."
              echo "**Approve the prompt in your Steam Mobile app** to finish going live."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Steam promotion pending::Approve build $BUILD_ID in the Steam Mobile app to finish going live."
            ;;
          200)
            echo "outcome=applied" >> "$GITHUB_OUTPUT"
            {
              echo "### Steam promotion applied"
              echo ""
              echo "Build \`$BUILD_ID\` (v$VERSION) is live on the **default** branch."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Build $BUILD_ID set live on default."
            ;;
          403)
            # Valve returns EResult 15 (AccessDenied) with "Approver steamID has
            # had a recent security event and cannot approve build changes" when
            # the approver account is inside the cooling-off window that follows
            # a security event (password reset, email change, authenticator
            # moved to a new device). It is time-bound and no permission grant
            # clears it — only waiting, or an unrestricted approver account.
            #
            # Its own case because it is the one failure worth retrying
            # unattended: nothing about the build is wrong.
            echo "outcome=restricted" >> "$GITHUB_OUTPUT"
            {
              echo "### Steam promotion refused — approver restricted"
              echo ""
              echo "Build \`$BUILD_ID\` (v$VERSION) is built, uploaded, and waiting on \`staging\`."
              echo ""
              echo "> $steam_message"
              echo ""
              echo "Nothing needs rebuilding. This clears when the approver account's"
              echo "restriction lapses; the scheduled retry will request it again."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$RESTRICTED_IS_FAILURE" = "false" ]; then
              echo "::warning title=Steam promotion still blocked::$steam_message"
              exit 0
            fi
            echo "::error::SetAppBuildLive returned HTTP 403 for build $BUILD_ID: $steam_message"
            exit 1
            ;;
          *)
            echo "::error::SetAppBuildLive returned HTTP $http_code for build $BUILD_ID. $steam_message"
            exit 1
            ;;
        esac
