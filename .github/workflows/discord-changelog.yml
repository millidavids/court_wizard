name: Discord Changelog Notification

on:
    push:
        branches: [main]
    workflow_dispatch:

jobs:
    notify:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Extract latest changelog entry
              id: changelog
              run: |
                  # Extract version number only (e.g., "v0.0.495") for git tag
                  version=$(sed -n '/^## \[/{s/^## \[//;s/\].*//;p;q}' CHANGELOG.md)

                  # Extract full title with date for Discord (e.g., "v0.0.495 - 2025-02-09")
                  full_title=$(sed -n '/^## \[/{s/^## \[\(.*\)\] - \(.*\)/\1 - \2/;p;q}' CHANGELOG.md)

                  # Extract body between first and second ## [ headers
                  body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' CHANGELOG.md)

                  # Trim leading/trailing blank lines
                  body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')

                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "full_title=$full_title" >> "$GITHUB_OUTPUT"

                  # Multiline output requires delimiter syntax
                  EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
                  echo "body<<$EOF" >> "$GITHUB_OUTPUT"
                  echo "$body" >> "$GITHUB_OUTPUT"
                  echo "$EOF" >> "$GITHUB_OUTPUT"

            - name: Check if tag exists
              id: check_tag
              run: |
                  VERSION="${{ steps.changelog.outputs.version }}"
                  if git rev-parse "v$VERSION" >/dev/null 2>&1; then
                    echo "exists=true" >> $GITHUB_OUTPUT
                    echo "Tag v$VERSION already exists, skipping notification"
                  else
                    echo "exists=false" >> $GITHUB_OUTPUT
                    echo "Tag v$VERSION does not exist, will send notification"
                  fi

            - name: Post to Discord
              if: steps.check_tag.outputs.exists == 'false' && env.DISCORD_WEBHOOK_URL != ''
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  FULL_TITLE: ${{ steps.changelog.outputs.full_title }}
                  BODY: ${{ steps.changelog.outputs.body }}
              run: |
                  play_link=$'\n\n🎮 **Play now:** https://millidavids.github.io/court_wizard/'
                  payload=$(jq -n \
                    --arg title "$FULL_TITLE" \
                    --arg desc "$BODY$play_link" \
                    '{embeds: [{title: $title, description: $desc, color: 16744448}]}')
                  curl -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"

            - name: Create and push tag
              if: steps.check_tag.outputs.exists == 'false'
              run: |
                  VERSION="${{ steps.changelog.outputs.version }}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag -a "v$VERSION" -m "Release v$VERSION"
                  git push origin "v$VERSION"
