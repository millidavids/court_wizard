name: Build

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # macOS is NOT built here: the shipped build must be signed/notarized,
      # which is slow and only needed once per release. The signed universal
      # .app is produced by macos-release.yml, called as a nested job of
      # release.yml (or run by hand from the Actions tab).
      matrix:
        include:
          - { platform: windows, runner: ubuntu-latest, target: x86_64-pc-windows-gnu,    suffix: windows }
          - { platform: linux,   runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux }

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable channel (pinned)
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev pkg-config

      - name: Install MinGW (Windows cross-compile)
        if: matrix.platform == 'windows'
        run: sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Build and package
        run: ./scripts/package.sh ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: court_wizard-${{ matrix.platform }}
          path: court_wizard-v*-${{ matrix.suffix }}.zip
          if-no-files-found: error
          # These only need to outlive the gap between a dev build and the
          # promotion that reuses it — usually minutes, occasionally days. The
          # durable copies are the GitHub Release assets.
          retention-days: 14
