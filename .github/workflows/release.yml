name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} already exists, skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Bundle release
        shell: pwsh
        run: |
          $dir = "release/court-wizard-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir
          Copy-Item "target/x86_64-pc-windows-msvc/release/court_wizard.exe" $dir/
          Copy-Item -Recurse "assets" "$dir/assets"
          Copy-Item "CHANGELOG.md" $dir/
          Copy-Item "CREDITS.md" $dir/
          Compress-Archive -Path "$dir/*" -DestinationPath "release/court-wizard-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: court-wizard-windows-x86_64
          path: release/court-wizard-windows-x86_64.zip

  build-macos:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build release binary
        run: cargo build --release --target aarch64-apple-darwin

      - name: Bundle release
        run: |
          dir="release/court-wizard-macos-aarch64"
          mkdir -p "$dir"
          cp target/aarch64-apple-darwin/release/court_wizard "$dir/"
          cp -r assets "$dir/assets"
          cp CHANGELOG.md "$dir/"
          cp CREDITS.md "$dir/"
          cd release && zip -r court-wizard-macos-aarch64.zip court-wizard-macos-aarch64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: court-wizard-macos-aarch64
          path: release/court-wizard-macos-aarch64.zip

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Bundle release
        run: |
          dir="release/court-wizard-linux-x86_64"
          mkdir -p "$dir"
          cp target/x86_64-unknown-linux-gnu/release/court_wizard "$dir/"
          cp -r assets "$dir/assets"
          cp CHANGELOG.md "$dir/"
          cp CREDITS.md "$dir/"
          cd release && zip -r court-wizard-linux-x86_64.zip court-wizard-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: court-wizard-linux-x86_64
          path: release/court-wizard-linux-x86_64.zip

  release:
    needs: [check-version, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract latest changelog entry
        id: changelog
        run: |
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/**/*.zip

  notify-discord:
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract latest changelog entry
        id: changelog
        run: |
          full_title=$(sed -n '/^## \[/{s/^## \[\(.*\)\] - \(.*\)/\1 - \2/;p;q}' CHANGELOG.md)
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          echo "full_title=$full_title" >> "$GITHUB_OUTPUT"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FULL_TITLE: ${{ steps.changelog.outputs.full_title }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          payload=$(jq -n \
            --arg title "$FULL_TITLE" \
            --arg desc "$BODY" \
            '{embeds: [{title: $title, description: $desc, color: 16744448}]}')
          curl -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
