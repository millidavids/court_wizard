name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} already exists, skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/build.yml

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Extract latest changelog entry
        id: changelog
        run: |
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' docs/CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/**/*.zip

  steam-deploy:
    # macOS (depot 4550881) is uploaded separately by macos-release.yml through
    # this same reusable workflow — the signed universal .app never passes
    # through here. The reusable workflow serializes steamcmd logins across
    # all callers via a shared concurrency group.
    needs: [check-version, build, release]
    if: needs.check-version.outputs.should_release == 'true' && vars.STEAM_DEPLOY == 'true'
    uses: ./.github/workflows/steam-upload.yml
    secrets: inherit
    with:
      app_id: '4550880'
      first_depot_id: '4550882' # depot1 windows=4550882, depot2 linux=4550883
      build_description: v${{ needs.check-version.outputs.version }} (${{ github.sha }})
      depot1_artifact: court_wizard-windows
      depot1_dir: windows
      depot2_artifact: court_wizard-linux
      depot2_dir: linux

  macos-release:
    # The signed/notarized macOS .app pipeline, nested into this run so it
    # builds off main and shows in this graph. Runs exactly once per release
    # (same should_release gate), never on ordinary pushes. Its Steam upload
    # job is gated on vars.STEAM_DEPLOY internally, same as steam-deploy above.
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/macos-release.yml
    secrets: inherit
    permissions:
      contents: write

  notify-discord:
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Extract latest changelog entry
        id: changelog
        run: |
          full_title=$(sed -n '/^## \[/{s/^## \[\(.*\)\] - \(.*\)/\1 - \2/;p;q}' docs/CHANGELOG.md)
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' docs/CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          # Discord's embed description hard-limits at 4096 characters. Trim
          # with python so multi-byte characters are counted correctly, ending
          # on a clean line break with an ellipsis if we had to cut.
          body=$(printf '%s' "$body" | python3 -c 'import sys; s = sys.stdin.read(); s = (s[:3990].rsplit(chr(10), 1)[0] + chr(10) + "…") if len(s) > 4000 else s; sys.stdout.write(s)')
          echo "full_title=$full_title" >> "$GITHUB_OUTPUT"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          FULL_TITLE: ${{ steps.changelog.outputs.full_title }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          payload=$(jq -n \
            --arg title "$FULL_TITLE" \
            --arg desc "$BODY" \
            '{embeds: [{title: $title, description: $desc, color: 16744448}]}')
          curl -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
