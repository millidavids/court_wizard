name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Tag v${{ steps.get_version.outputs.version }} already exists, skipping release"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    uses: ./.github/workflows/build.yml

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
          git push origin "v${{ needs.check-version.outputs.version }}"

      - name: Extract latest changelog entry
        id: changelog
        run: |
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' docs/CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/**/*.zip

  steam-deploy:
    needs: [check-version, build, release]
    if: needs.check-version.outputs.should_release == 'true' && vars.STEAM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage content
        run: |
          mkdir -p steam-content/windows steam-content/linux steam-content/macos
          unzip -q artifacts/court_wizard-windows/*.zip -d steam-content/windows
          unzip -q artifacts/court_wizard-linux/*.zip   -d steam-content/linux
          unzip -q artifacts/court_wizard-macos/*.zip   -d steam-content/macos

      - name: Upload build to Steamworks
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USER }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: '4550880'
          firstDepotIdOverride: '4550882'
          buildDescription: v${{ needs.check-version.outputs.version }} (${{ github.sha }})
          rootPath: steam-content
          depot1Path: windows/court_wizard
          depot2Path: linux/court_wizard
          depot3Path: macos/court_wizard
          releaseBranch: staging

  notify-discord:
    needs: [check-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@v5

      - name: Extract latest changelog entry
        id: changelog
        run: |
          full_title=$(sed -n '/^## \[/{s/^## \[\(.*\)\] - \(.*\)/\1 - \2/;p;q}' docs/CHANGELOG.md)
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' docs/CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          # Discord's embed description hard-limits at 4096 characters. Trim
          # with python so multi-byte characters are counted correctly, ending
          # on a clean line break with an ellipsis if we had to cut.
          body=$(printf '%s' "$body" | python3 -c 'import sys; s = sys.stdin.read(); s = (s[:3990].rsplit(chr(10), 1)[0] + chr(10) + "…") if len(s) > 4000 else s; sys.stdout.write(s)')
          echo "full_title=$full_title" >> "$GITHUB_OUTPUT"
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Post to Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          FULL_TITLE: ${{ steps.changelog.outputs.full_title }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          payload=$(jq -n \
            --arg title "$FULL_TITLE" \
            --arg desc "$BODY" \
            '{embeds: [{title: $title, description: $desc, color: 16744448}]}')
          curl -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK_URL"
