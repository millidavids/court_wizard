name: Release

# PROMOTION ONLY — this workflow builds nothing.
#
# dev-release.yml already built this exact commit off `dev` and published it to
# the Steam `staging` branch. Because the /game-release skill fast-forwards main
# onto that very dev commit, github.sha here is the same commit, which is how we
# find that run and reuse its artifacts and its Steam build.
#
# What it does:
#   1. locate the dev-release run for this commit (waiting if it's still going)
#   2. tag + GitHub Release, using THAT run's zips (never freshly built ones)
#   3. ask Steam to set that run's build live on the default branch
#   4. render the changelog as Steam BBCode for pasting into a Steamworks event
#
# Step 3 cannot complete unattended: setting a build live on the default branch
# of a released app always sends an authorization prompt to the Steam Mobile
# app. The job requests the promotion and reports that it is pending; you
# approve on your phone.
#
# Which is why announcing does NOT happen here. steam-promote.yml picks the
# release up from this point — retrying the request while the approver is
# blocked, then watching for the build to actually go live on `public`, and
# only then posting to Discord.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Re-run even if the tag already exists. Needed to retry a failed Steam
          promotion: the tag is created before the promotion, so the normal
          tag-exists guard would otherwise block every retry.
        required: false
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          # This grep once returned "Unreleased" and the tag step below dutifully
          # created `vUnreleased`, which then sorted after every real version and
          # sat on the remote for months. Fail loudly instead of tagging garbage.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Cargo.toml version parsed as '$VERSION', which is not X.Y.Z. Refusing to tag."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "force=true — ignoring the tag-exists guard"
          elif git rev-parse "v${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.get_version.outputs.version }} already exists, skipping release"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  locate-dev-build:
    # Find the dev-release.yml run that built THIS commit. Normally it has long
    # since finished (you play-test on staging before promoting), but if you
    # promote straight after a dev release we wait for it rather than failing.
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Must be able to outwait a cold macOS build (240m ceiling) plus queue time.
    timeout-minutes: 330
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: Find and await the dev-release run for this commit
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Poll rather than one-shot: the run may still be in progress, and a
          # dev release can legitimately be minutes old at promotion time.
          deadline=$(( $(date +%s) + 320 * 60 ))
          api_failures=0
          while :; do
            # Don't let a transient API blip during a multi-hour poll get
            # misreported as "no dev-release run exists". Tolerate a few in a
            # row, then give up with the real reason.
            if ! run_json=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/dev-release.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[]] | sort_by(.run_number) | last // empty'); then
              api_failures=$(( api_failures + 1 ))
              if [ "$api_failures" -ge 5 ]; then
                echo "::error::Could not query the Actions API after $api_failures attempts."
                exit 1
              fi
              echo "Actions API query failed (attempt $api_failures) — retrying…"
              sleep 30
              continue
            fi
            api_failures=0

            if [ -z "$run_json" ]; then
              echo "::error::No dev-release run found for $GITHUB_SHA. main must be fast-forwarded onto a dev commit that was built and pushed to Steam staging (see .claude/skills/game-release/SKILL.md). To build and promote from scratch, run dev-release.yml on this commit first."
              exit 1
            fi

            run_id=$(printf '%s' "$run_json" | jq -r '.id')
            status=$(printf '%s' "$run_json" | jq -r '.status')
            conclusion=$(printf '%s' "$run_json" | jq -r '.conclusion // ""')

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "Using dev-release run $run_id"
                exit 0
              fi
              echo "::error::dev-release run $run_id for this commit concluded '$conclusion'. Fix and re-run it, then re-run this workflow."
              exit 1
            fi

            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for dev-release run $run_id (status: $status)."
              exit 1
            fi

            echo "dev-release run $run_id is $status — waiting…"
            sleep 60
          done

  github-release:
    needs: [check-version, locate-dev-build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Download the dev-release run's artifacts
        # Cross-run download: these zips are the ones already on Steam staging.
        # Rebuilding here would attach different bytes than players receive.
        # macos-release.yml runs inside dev-release.yml via workflow_call, so
        # its court_wizard-macos artifact belongs to that same run id.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          run-id: ${{ needs.locate-dev-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all three platform zips are present
        run: |
          set -euo pipefail
          # Single-level glob on purpose: download-artifact lays these out as
          # artifacts/<artifact-name>/<zip>. (`**` without shopt -s globstar is
          # just `*` in bash, so relying on it would work only by accident.)
          missing=0
          for suffix in windows linux macos-universal; do
            if ! compgen -G "artifacts/*/court_wizard-v*-$suffix.zip" >/dev/null; then
              echo "::error::No $suffix zip in the dev-release artifacts — the release would ship missing a platform."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v${{ needs.check-version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ needs.check-version.outputs.version }} already exists (force re-run) — keeping it"
          else
            git tag -a "v${{ needs.check-version.outputs.version }}" -m "Release v${{ needs.check-version.outputs.version }}"
            git push origin "v${{ needs.check-version.outputs.version }}"
          fi

      - name: Extract latest changelog entry
        id: changelog
        run: |
          body=$(sed -n '/^## \[/{n; :a; /^## \[/q; p; n; ba}' docs/CHANGELOG.md)
          body=$(echo "$body" | sed '/./,$!d' | sed -e :a -e '/^[[:space:]]*$/d;N;ba')
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<$EOF" >> "$GITHUB_OUTPUT"
          echo "$body" >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/**/*.zip

  steam-request-promotion:
    # Asks Steam to set the dev-release build live on the DEFAULT branch.
    #
    # This cannot complete unattended and that is by design on Valve's side:
    # since Oct 2023, assigning a build to the default branch of a released app
    # sends an authorization prompt to the Steam Mobile app of the account in
    # `steamid`. HTTP 201 is the NORMAL response and means "pending your
    # confirmation" — not an error, and not "done".
    #
    # The value here is that it picks the right build id for you, which is where
    # dashboard mistakes actually happen.
    needs: [check-version, locate-dev-build, github-release]
    if: needs.check-version.outputs.should_release == 'true' && vars.STEAM_DEPLOY == 'true'
    runs-on: ubuntu-latest
    # Guards the one key in this repo that can ship to players.
    #
    # IMPORTANT: GitHub creates a referenced environment on first use with NO
    # protection rules, so this line buys nothing until you go to
    # Settings → Environments → steam-promotion and add required reviewers.
    # Until then the job runs unguarded. The secrets below resolve from repo
    # scope either way, so nothing breaks if you'd rather delete this line.
    environment: steam-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve the Steam build id
        id: build
        uses: ./.github/actions/steam-build-id
        with:
          publisher-api-key: ${{ secrets.STEAM_PUBLISHER_API_KEY }}
          app-id: '4550880'
          run-id: ${{ needs.locate-dev-build.outputs.run_id }}

      - name: Set the staging build live on default
        id: promote
        uses: ./.github/actions/steam-promote
        with:
          publisher-api-key: ${{ secrets.STEAM_PUBLISHER_API_KEY }}
          steamid: ${{ secrets.STEAM_PUBLISH_STEAMID }}
          app-id: '4550880'
          build-id: ${{ steps.build.outputs.build-id }}
          version: ${{ needs.check-version.outputs.version }}

      - name: Mark this version as promoted
        if: steps.promote.outputs.outcome == 'requested' || steps.promote.outputs.outcome == 'applied'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          # Tells steam-promote.yml's scheduled retry that the request already
          # landed, so it does not re-prompt the approver's phone every 6 hours
          # while they simply have not tapped yet.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git rev-parse "promoted/v$VERSION" >/dev/null 2>&1; then
            echo "Marker promoted/v$VERSION already exists."
          else
            git tag -a "promoted/v$VERSION" -m "Steam promotion requested for v$VERSION"
            git push origin "promoted/v$VERSION"
          fi

  steam-announcement:
    # Steamworks has no supported API for creating events/announcements, so
    # render the patch notes as BBCode and hand them over for pasting.
    needs: [check-version, github-release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Render changelog as Steam BBCode
        run: |
          set -euo pipefail
          ./scripts/changelog_to_bbcode.sh > steam-announcement.bbcode
          {
            echo "### Steamworks announcement (copy-paste)"
            echo ""
            echo "Steamworks → Court Wizard → Hub Admin → create event → *Small Update / Patch Notes*."
            echo ""
            echo '```'
            cat steam-announcement.bbcode
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload announcement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: steam-announcement
          path: steam-announcement.bbcode
          if-no-files-found: error
          retention-days: 14

  # Discord is deliberately NOT notified here. A successful promotion step means
  # Steam returned HTTP 201 — "confirmation sent to the approver's phone" — not
  # that players have the build. Announcing on that would advertise a release
  # that is still one untapped prompt away, and if the prompt were declined it
  # would never arrive at all.
  #
  # steam-promote.yml owns the announcement instead: it checks GetAppBetas every
  # 6 hours and posts once `public` actually points at our build.
