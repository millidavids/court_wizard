name: Steam Upload

# Shared Steam depot upload, called by dev-release.yml with all three depots at
# once. Centralizes the steam-deploy action pin, the branch strategy, and —
# critically — the serialization of steamcmd logins: Steam's anti-fraud locks
# builder accounts on concurrent logins, so every Steam upload across all
# workflows shares one static concurrency group.
#
# All three platforms go up in ONE invocation, producing ONE Steam build id.
# That matters at promotion time: setting a build live on the default branch of
# a released app sends a confirmation prompt to the Steam Mobile app, so N build
# ids means N phone taps — and, in between them, a default branch where some
# platforms have the new build and others don't.

on:
  workflow_call:
    inputs:
      app_id:
        description: Steamworks app id to upload to
        required: true
        type: string
      first_depot_id:
        description: firstDepotIdOverride — depot ids increment from here in depot order
        required: true
        type: string
      build_description:
        description: Build description shown in the Steamworks builds list
        required: true
        type: string
      release_branch:
        description: Steam branch to set live on (release.yml promotes to default separately)
        required: false
        type: string
        default: staging
      depot1_artifact:
        description: Name of the uploaded artifact holding depot 1's zip
        required: true
        type: string
      depot1_dir:
        description: Staging dir for depot 1 (depot path becomes <dir>/court_wizard)
        required: true
        type: string
      depot2_artifact:
        description: Optional artifact for depot 2 (empty = fewer depots)
        required: false
        type: string
        default: ''
      depot2_dir:
        description: Staging dir for depot 2
        required: false
        type: string
        default: ''
      depot3_artifact:
        description: Optional artifact for depot 3 (empty = fewer depots)
        required: false
        type: string
        default: ''
      depot3_dir:
        description: Staging dir for depot 3
        required: false
        type: string
        default: ''

jobs:
  upload:
    runs-on: ubuntu-latest
    # One steamcmd login at a time, repo-wide (see header comment).
    concurrency:
      group: steam-deploy
      cancel-in-progress: false
    steps:
      # Named downloads, one per depot: download-artifact errors out when a
      # named artifact is missing, so a build leg that silently failed to
      # publish its zip fails HERE rather than producing a Steam build with a
      # missing platform.
      - name: Download depot 1 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.depot1_artifact }}
          path: artifacts/${{ inputs.depot1_artifact }}

      - name: Download depot 2 artifact
        if: inputs.depot2_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.depot2_artifact }}
          path: artifacts/${{ inputs.depot2_artifact }}

      - name: Download depot 3 artifact
        if: inputs.depot3_artifact != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.depot3_artifact }}
          path: artifacts/${{ inputs.depot3_artifact }}

      - name: Stage content
        run: |
          set -euo pipefail
          # Info-ZIP unzip restores the exec bits stored in the zips (the
          # macOS zip is ditto-made specifically so the signed bundle's bits
          # survive this round trip untouched).
          stage() {
            mkdir -p "steam-content/$2"
            unzip -q artifacts/"$1"/*.zip -d "steam-content/$2"
          }
          stage "${{ inputs.depot1_artifact }}" "${{ inputs.depot1_dir }}"
          if [ -n "${{ inputs.depot2_artifact }}" ]; then
            stage "${{ inputs.depot2_artifact }}" "${{ inputs.depot2_dir }}"
          fi
          if [ -n "${{ inputs.depot3_artifact }}" ]; then
            stage "${{ inputs.depot3_artifact }}" "${{ inputs.depot3_dir }}"
          fi

      - name: Upload build to Steamworks
        uses: game-ci/steam-deploy@8bd9baca6407f9abd210bd1eef3c45f56e12d8d9 # v3.2.0
        with:
          username: ${{ secrets.STEAM_USER }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ inputs.app_id }}
          firstDepotIdOverride: ${{ inputs.first_depot_id }}
          buildDescription: ${{ inputs.build_description }}
          rootPath: steam-content
          depot1Path: ${{ inputs.depot1_dir }}/court_wizard
          depot2Path: ${{ inputs.depot2_dir != '' && format('{0}/court_wizard', inputs.depot2_dir) || '' }}
          depot3Path: ${{ inputs.depot3_dir != '' && format('{0}/court_wizard', inputs.depot3_dir) || '' }}
          releaseBranch: ${{ inputs.release_branch }}
