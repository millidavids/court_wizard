name: macOS Release

# Builds a universal (arm64 + x86_64) Court Wizard.app, signs it with a
# Developer ID certificate via rcodesign, notarizes + staples it through
# Apple's notary service, verifies the result, and publishes it as the
# `court_wizard-macos` artifact.
#
# BUILD ONLY. This workflow does not touch Steam and does not touch GitHub
# Releases. dev-release.yml calls it, then hands its artifact to
# steam-upload.yml alongside the Windows/Linux zips so all three platforms go
# up as a SINGLE Steam build (one build id = one promotion confirmation).
#
# Deliberately NOT part of the every-push build matrix (build.yml) — the
# shipped macOS build must be signed/notarized, which is slow, so it runs only
# on a release. It runs via:
#   - workflow_call — dev-release.yml calls it (the normal path)
#   - workflow_dispatch — manual run from the Actions tab

on:
  workflow_call:
  workflow_dispatch:

# Standalone-run dedupe (ignored for workflow_call invocations — those are
# covered by the job-level group below). Steam upload serialization is
# handled separately by steam-upload.yml's shared group.
concurrency:
  group: macos-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-sign-notarize:
    name: Build, sign, notarize (universal .app)
    runs-on: macos-latest
    # Keyed per-commit, NOT a static group. GitHub allows only one *pending*
    # job per concurrency group and cancels the previously pending one — so a
    # static group here meant a dev release fired while an earlier build was
    # still queued would silently cancel that earlier build. Promotion looks up
    # a specific commit's run, so a cancelled build stalls the release. Per-SHA
    # keeps the "never build the same commit twice at once" guarantee without
    # letting different commits evict each other.
    concurrency:
      group: macos-build-sign-${{ github.sha }}
      cancel-in-progress: false
    # Cold-cache reality check (v1.0.13 first run): a fat-LTO, codegen-units=1
    # release build of both Apple targets alone exceeds 90 minutes — the run
    # was cancelled by its own timeout mid-build. 240 covers a fully cold
    # build of both targets plus a slow first notarization; cached runs are
    # far shorter.
    timeout-minutes: 240
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Extract version from Cargo.toml
        id: get_version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable channel (pinned)
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: macos-universal
          # Save the dependency cache even when a later step fails or times
          # out — otherwise every retry of this rarely-run, 10x-billed job
          # starts from a cold cache (exactly what burned the first run).
          cache-on-failure: true

      - name: Install rcodesign
        # CAUTION: these env vars must NOT start with RCODESIGN_ — rcodesign
        # maps every RCODESIGN_* environment variable onto its config schema
        # (not disableable), and unknown keys are a hard error on every
        # invocation. RCODESIGN_SHA256 broke all signing in the v1.0.13 retry.
        env:
          APPLE_CODESIGN_VERSION: '0.29.0'
          APPLE_CODESIGN_SHA256: d98372d5524226ccf9dc0eda03d4e4f5826182dabb2fc3f2bd303ed9113a748d
        run: |
          set -euo pipefail
          curl -sSfL -o rcodesign.tar.gz \
            "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${APPLE_CODESIGN_VERSION}/apple-codesign-${APPLE_CODESIGN_VERSION}-macos-universal.tar.gz"
          echo "${APPLE_CODESIGN_SHA256}  rcodesign.tar.gz" | shasum -a 256 -c -
          tar -xzf rcodesign.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 755 "apple-codesign-${APPLE_CODESIGN_VERSION}-macos-universal/rcodesign" "$HOME/.local/bin/rcodesign"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf rcodesign.tar.gz "apple-codesign-${APPLE_CODESIGN_VERSION}-macos-universal"
          "$HOME/.local/bin/rcodesign" --version

      - name: Decode signing secrets
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPSTORE_API_KEY_JSON: ${{ secrets.APPSTORE_API_KEY_JSON }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          # Strip CR/LF from the password: a secret set via `gh secret set < file`
          # carries a trailing newline, which fails PFX decryption with
          # "incorrect password". Real passwords don't contain newlines.
          printf '%s' "$APPLE_CERT_PASSWORD" | tr -d '\r\n' > "$RUNNER_TEMP/p12-password.txt"
          printf '%s' "$APPSTORE_API_KEY_JSON" | base64 -d > "$RUNNER_TEMP/asc-key.json"

      - name: Validate signing secrets (fail fast)
        run: |
          set -euo pipefail
          # Prove the p12 decrypts with the provided password BEFORE spending
          # runner time on the build — a wrong secret fails here in seconds.
          rcodesign analyze-certificate \
            --p12-file "$RUNNER_TEMP/cert.p12" \
            --p12-password-file "$RUNNER_TEMP/p12-password.txt" > /dev/null
          echo "p12 decrypts OK"
          python3 -m json.tool "$RUNNER_TEMP/asc-key.json" > /dev/null
          echo "ASC API key decoded to valid JSON"

      - name: Build universal binary and assemble Court Wizard.app
        run: ./scripts/package_macos_app.sh --no-zip

      - name: Sign (nested dylib first, then the outer bundle)
        run: |
          set -euo pipefail
          APP="dist/macos/court_wizard/Court Wizard.app"
          # Order matters: nested Mach-O code is signed before the outer bundle
          # so the bundle seal covers the final dylib signature. (rcodesign also
          # recurses into nested code when signing a bundle; the explicit pass
          # pins the ordering regardless.) --for-notarization enables the
          # hardened runtime + secure timestamps and enforces notarization
          # requirements. The p12 password is passed via file, never argv.
          # Both invocations share SIGN_ARGS so their configurations can't
          # drift; the entitlements (Steam overlay needs DYLD injection under
          # the hardened runtime — see packaging/macos/entitlements.plist) go
          # on the bundle sign only, since entitlements apply to the main
          # executable and dylibs don't carry them.
          SIGN_ARGS=(
            --p12-file "$RUNNER_TEMP/cert.p12"
            --p12-password-file "$RUNNER_TEMP/p12-password.txt"
            --for-notarization
          )
          rcodesign sign "${SIGN_ARGS[@]}" \
            "$APP/Contents/MacOS/libsteam_api.dylib"
          rcodesign sign "${SIGN_ARGS[@]}" \
            --entitlements-xml-path packaging/macos/entitlements.plist \
            "$APP"

      - name: Notarize and staple
        run: |
          set -euo pipefail
          # First-time notarization commonly fails on hardened-runtime and
          # nested-binary issues (an unsigned nested Mach-O, a missing runtime
          # flag). When it does, grab the submission ID from this step's output
          # and inspect Apple's per-file findings with:
          #   rcodesign notary-log --api-key-file <asc-key.json> <submission-id>
          rcodesign notary-submit \
            --api-key-file "$RUNNER_TEMP/asc-key.json" \
            --staple --wait \
            "dist/macos/court_wizard/Court Wizard.app"

      - name: Verify signature, notarization, and universal binary
        run: |
          set -euo pipefail
          APP="dist/macos/court_wizard/Court Wizard.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl -a -vvv -t exec "$APP"
          xcrun stapler validate "$APP"
          ARCHS=$(lipo -archs "$APP/Contents/MacOS/court_wizard")
          echo "binary architectures: $ARCHS"
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::court_wizard is not a universal binary (got: $ARCHS)"; exit 1 ;;
          esac
          lipo -info "$APP/Contents/MacOS/court_wizard"

      - name: Package signed bundle
        run: |
          set -euo pipefail
          # The bundle is signed and stapled — NOTHING may modify its contents
          # from here on, or the signature is invalidated. ditto preserves the
          # exec bits and metadata that upload-artifact alone would strip.
          ditto -c -k --keepParent dist/macos/court_wizard \
            "court_wizard-v${{ steps.get_version.outputs.version }}-macos-universal.zip"

      - name: Clean up decoded secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/p12-password.txt" "$RUNNER_TEMP/asc-key.json"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: court_wizard-macos
          path: court_wizard-v*-macos-universal.zip
          if-no-files-found: error
          # Only needs to outlive the gap between a dev build and the promotion
          # that reuses it. The durable copy is the GitHub Release asset.
          retention-days: 14

# NOTE: this workflow used to own two more jobs, both deliberately removed.
#
#   steam-deploy-macos — uploaded the macOS depot on its own, producing a
#     SECOND Steam build id per release. Promotion to the default branch needs a
#     Steam Mobile confirmation per build id, so two ids meant two phone taps
#     and a window where default had the new macOS build but the old Windows
#     and Linux ones. dev-release.yml now hands this artifact to
#     steam-upload.yml together with the other two, as one build.
#
#   attach-to-github-release — did `gh release upload v$VERSION --clobber`.
#     Harmless while this workflow only ran off main after the release existed,
#     but it now runs off dev, where Cargo.toml still holds the ALREADY-RELEASED
#     version until a local debug build bumps it. It would therefore have
#     overwritten the published release's macOS asset with an unreleased dev
#     build. release.yml attaches all three zips from the dev run instead.
