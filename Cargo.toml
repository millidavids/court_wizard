[package]
name = "court_wizard"
version = "1.0.41"
edition = "2024"
default-run = "court_wizard"
repository = "https://github.com/millidavids/court_wizard"

[features]
default = []
# Enables in-game diagnostics logging and F3 toggle. Used by the
# `bench-release` profile to measure hardware performance without
# bloating the regular release binary.
benchmarking = ["bevy/sysinfo_plugin"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    # Core rendering and 2D
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_pbr",         # For 3D billboard effects (cauldron)
    "bevy_mesh",
    "bevy_image",
    "bevy_camera",
    "tonemapping_luts", # For proper color grading
    "zstd_rust",        # Required by tonemapping_luts

    # UI and Text
    "bevy_text",        # Text rendering - REQUIRED!
    "default_font",     # Embedded default font - REQUIRED for text!
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "ui_picking",
    "sprite_picking",

    # Window and input
    #
    # `bevy_input_focus` is deliberately absent. Enabling it puts
    # `InputFocusPlugin` + `InputDispatchPlugin` into `DefaultPlugins` and wires
    # click-to-focus into `ui_picking`, none of which this game uses — it has its
    # own focus system in `src/ui/focus/`, and bevy's would run off the
    # *uncorrected* cursor while `correct_ui_interaction_for_barrel` corrects
    # everything else for CRT barrel distortion.
    "bevy_window",
    "bevy_winit",
    "bevy_gilrs",       # Gamepad/controller support via gilrs

    # Audio
    "bevy_audio",
    "vorbis",

    # Assets
    #
    # No scene feature: the game never spawns a scene. In 0.19 `bevy_scene` is
    # the new BSN crate and `bevy_world_serialization` is the old one; we need
    # neither.
    "bevy_asset",
    "bevy_state",

    # Image formats
    "png",
    "jpeg",

    # Platform support (Linux)
    # x11 and wayland are added conditionally below
    # Performance
    "multi_threaded",

    # Utilities
    "bevy_color",
    "bevy_log",
    "serialize",

    # Debug (names in error messages, picking debug overlay)
    "debug",
] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
toml = "0.8"
thiserror = "2.0"
rand = "0.9"
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }
dirs = "6.0"
bevy-steamworks = "0.17"
# Direct handles to the exact versions bevy-steamworks 0.17 already resolves, so
# we can name `steamworks::InputType` and call the Steam Input haptics FFI
# (`steamworks-sys`) the safe `Input` wrapper doesn't expose. Exact-pinned so the
# FFI surface can't drift.
steamworks = "=0.13.1"
steamworks-sys = "=0.13.0"
iroh = "0.98"
tokio = { version = "1", features = ["rt", "sync", "time"] }
# `CancellationToken` only. Already in the tree via iroh, and `tokio_util::sync`
# is not feature-gated, so this adds no compile units. We need it because
# `Notify::notify_waiters()` stores no permit: a task that is woken by its OTHER
# select branch on the same poll drops the shutdown notification on the floor and
# then parks forever. `CancellationToken` is level-triggered and sticky.
tokio-util = { version = "0.7", default-features = false }
crossbeam-channel = "0.5"
bytes = "1"
arboard = "3"
data-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }
webbrowser = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["x11", "wayland"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Identical codegen to release — used with `--features benchmarking` to
# produce a binary with release performance characteristics plus the
# diagnostics/debug tooling compiled in.
[profile.bench-release]
inherits = "release"
