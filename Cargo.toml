[package]
name = "court_wizard"
version = "0.6.195"
edition = "2024"
default-run = "court_wizard"
repository = "https://github.com/millidavids/court_wizard"

[features]
default = []
# Enables in-game diagnostics logging and F3 toggle. Used by the
# `bench-release` profile to measure hardware performance without
# bloating the regular release binary.
benchmarking = ["bevy/sysinfo_plugin"]

[dependencies]
bevy = { version = "0.17.3", default-features = false, features = [
    # Core rendering and 2D
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_pbr",         # For 3D billboard effects (cauldron)
    "bevy_mesh",
    "bevy_image",
    "bevy_camera",
    "tonemapping_luts", # For proper color grading
    "zstd_rust",        # Required by tonemapping_luts

    # UI and Text
    "bevy_text",        # Text rendering - REQUIRED!
    "default_font",     # Embedded default font - REQUIRED for text!
    "bevy_ui",
    "bevy_ui_render",
    "bevy_picking",
    "bevy_ui_picking_backend",
    "bevy_sprite_picking_backend",

    # Window and input
    "bevy_window",
    "bevy_winit",
    "bevy_input_focus",

    # Audio
    "bevy_audio",
    "vorbis",

    # Assets and scenes
    "bevy_asset",
    "bevy_scene",
    "bevy_state",

    # Image formats
    "png",
    "jpeg",

    # Platform support (Linux)
    # x11 and wayland are added conditionally below
    # Performance
    "multi_threaded",

    # Utilities
    "bevy_color",
    "bevy_log",
    "serialize",

    # Debug (names in error messages, picking debug overlay)
    "debug",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
rand = "0.8"
tracing = { version = "0.1", features = ["max_level_debug", "release_max_level_warn"] }
dirs = "6.0"
bevy-steamworks = "0.15"
iroh = "0.97"
tokio = { version = "1", features = ["rt", "sync", "time"] }
crossbeam-channel = "0.5"
bytes = "1"
arboard = "3"
data-encoding = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
bevy = { version = "0.17.3", default-features = false, features = ["x11", "wayland"] }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Identical codegen to release — used with `--features benchmarking` to
# produce a binary with release performance characteristics plus the
# diagnostics/debug tooling compiled in.
[profile.bench-release]
inherits = "release"
