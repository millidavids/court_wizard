# Make the binary search its own directory for shared libraries shipped next to it
# (libsteam_api.so / libsteam_api.dylib). Without this, the dynamic linker won't
# find them. Windows searches the .exe's directory by default, so no flag needed.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,@loader_path"]
