<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Court Wizard</title>
        <link rel="icon" type="image/svg+xml" href="wizard_hat.svg" />
        <link rel="alternate icon" href="wizard_hat.svg" />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 100%;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #000;
                overflow: hidden;
            }

            #canvas-container {
                /* Container will be sized by JavaScript to maintain aspect ratio */
                position: relative;
                border: none;
                outline: none;
            }

            #bevy-canvas {
                display: block;
                border: none;
                outline: none;
            }

            /* Loading Screen Overlay */
            #loading-screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.95);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
                opacity: 1;
                transition: opacity 0.5s ease-out;
            }

            #loading-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }

            /* Loading Content Container */
            .loading-content {
                text-align: center;
                color: rgb(230, 230, 230);
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
            }

            /* Animated Spinner */
            .spinner {
                width: 150px;
                height: 150px;
                margin: 0 auto 30px;
                animation: spin 2s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            /* Title Styling */
            .loading-title {
                font-size: 48px;
                margin: 0 0 20px 0;
                font-weight: 700;
                letter-spacing: 2px;
                text-shadow: 0 0 20px rgba(51, 153, 255, 0.4);
                white-space: nowrap;
            }

            /* Loading Text */
            .loading-text {
                font-size: 20px;
                color: rgb(200, 200, 200);
                margin: 0;
            }

            /* Animated Dots */
            .dots::after {
                content: "";
                animation: dots 1.5s steps(4, end) infinite;
            }

            @keyframes dots {
                0%,
                20% {
                    content: "";
                }
                40% {
                    content: ".";
                }
                60% {
                    content: "..";
                }
                80%,
                100% {
                    content: "...";
                }
            }

            /* Responsive Scaling */
            @media (max-width: 768px) {
                .loading-title {
                    font-size: 36px;
                }
                .loading-text {
                    font-size: 16px;
                }
                .spinner {
                    width: 60px;
                    height: 60px;
                    margin-bottom: 20px;
                }
            }
        </style>
    </head>
    <body>
        <div id="canvas-container">
            <div id="loading-screen">
                <div class="loading-content">
                    <img src="wizard_hat.svg" alt="Loading" class="spinner" />
                    <h1 class="loading-title">Court Wizard</h1>
                    <p class="loading-text">
                        Loading<span class="dots"></span>
                    </p>
                </div>
            </div>
            <canvas id="bevy-canvas"></canvas>
        </div>

        <script type="module">
            import init from "./court_wizard.js";

            // Maintain 16:9 aspect ratio, constrained by both width and height
            function resizeCanvas() {
                const container = document.getElementById("canvas-container");
                const canvas = document.getElementById("bevy-canvas");

                const targetAspectRatio = 16 / 9;
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const windowAspectRatio = windowWidth / windowHeight;

                let canvasWidth, canvasHeight;

                if (windowAspectRatio > targetAspectRatio) {
                    // Window is too wide - constrain by height
                    canvasHeight = windowHeight;
                    canvasWidth = canvasHeight * targetAspectRatio;
                } else {
                    // Window is too tall - constrain by width
                    canvasWidth = windowWidth;
                    canvasHeight = canvasWidth / targetAspectRatio;
                }

                container.style.width = `${canvasWidth}px`;
                container.style.height = `${canvasHeight}px`;
                // Set canvas CSS size (not canvas internal resolution)
                canvas.style.width = `${canvasWidth}px`;
                canvas.style.height = `${canvasHeight}px`;
            }

            // Resize on load and window resize
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            // Get loading screen element
            const loadingScreen = document.getElementById("loading-screen");

            // Initialize WASM and hide loading screen on success
            init()
                .then(() => {
                    // Add hidden class to trigger fade-out transition
                    loadingScreen.classList.add("hidden");

                    // Remove from DOM after transition completes (500ms)
                    setTimeout(() => {
                        loadingScreen.remove();
                    }, 500);
                })
                .catch((error) => {
                    // Check for Bevy's control flow exception
                    if (
                        !error.message.startsWith(
                            "Using exceptions for control flow, don't mind me. This isn't actually an error!",
                        )
                    ) {
                        // Show error message in loading screen
                        loadingScreen.innerHTML = `
                            <div class="loading-content">
                                <h1 class="loading-title" style="color: rgb(255, 100, 100);">Error Loading Game</h1>
                                <p class="loading-text">${error.message}</p>
                                <p class="loading-text" style="margin-top: 20px; font-size: 16px;">Please refresh the page to try again.</p>
                            </div>
                        `;
                        throw error;
                    } else {
                        // Handle control flow exception as success
                        loadingScreen.classList.add("hidden");
                        setTimeout(() => {
                            loadingScreen.remove();
                        }, 500);
                    }
                });
        </script>
    </body>
</html>
