<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Court Wizard</title>
        <link rel="icon" type="image/svg+xml" href="logo.png" />
        <link rel="alternate icon" href="logo.png" />
        <style>
            @font-face {
                font-family: "PressStart2P";
                src: url("assets/fonts/PressStart2P-Regular.ttf")
                    format("truetype");
                font-weight: 400;
                font-style: normal;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 100%;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                background-color: #000;
                overflow: hidden;
            }

            #canvas-container {
                /* Container will be sized by JavaScript to maintain aspect ratio */
                position: relative;
                border: none;
                outline: none;
            }

            #bevy-canvas {
                display: block;
                border: none;
                outline: none;
            }

            /* Start Screen Overlay */
            #start-screen,
            #loading-screen {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.95);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 1000;
                opacity: 1;
                transition: opacity 0.5s ease-out;
            }

            #start-screen.hidden,
            #loading-screen.hidden {
                opacity: 0;
                pointer-events: none;
            }

            /* Loading Content Container */
            .loading-content {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                color: rgb(230, 230, 230);
                font-family: "PressStart2P", sans-serif;
            }

            /* Animated Spinner */
            .spinner {
                width: 300px;
                height: 300px;
                margin: 0 auto;
                animation: spin 2s linear infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            /* Title Styling */
            .loading-title {
                font-size: 72px;
                margin: 0 0 20px 0;
                font-weight: 700;
                letter-spacing: 2px;
                text-shadow: 0 0 20px rgba(51, 153, 255, 0.4);
                white-space: nowrap;
            }

            /* Loading Text */
            .loading-text {
                font-size: 20px;
                color: rgb(200, 200, 200);
                margin: 0;
            }

            /* Animated Dots */
            .dots::after {
                content: "";
                animation: dots 1.5s steps(4, end) infinite;
            }

            @keyframes dots {
                0%,
                20% {
                    content: "";
                }
                40% {
                    content: ".";
                }
                60% {
                    content: "..";
                }
                80%,
                100% {
                    content: "...";
                }
            }

            /* Responsive Scaling */
            @media (max-width: 768px) {
                .loading-title {
                    font-size: 36px;
                }
                .loading-text {
                    font-size: 16px;
                }
                .spinner {
                    width: 60px;
                    height: 60px;
                    margin-bottom: 20px;
                }
            }
        </style>
    </head>
    <body>
        <div id="canvas-container">
            <div id="start-screen">
                <div class="loading-content">
                    <h1 class="loading-title">Court Wizard</h1>
                    <img
                        src="logo.png"
                        alt="Court Wizard"
                        class="spinner"
                        style="animation: none; margin-top: 30px"
                    />
                    <button
                        id="start-button"
                        style="
                            margin-top: 40px;
                            padding: 20px 60px;
                            font-size: 32px;
                            font-weight: 700;
                            color: white;
                            background: linear-gradient(
                                135deg,
                                #667eea 0%,
                                #764ba2 100%
                            );
                            border: none;
                            border-radius: 50px;
                            cursor: pointer;
                            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
                            transition: all 0.3s ease;
                            font-family: &quot;PressStart2P&quot;, serif;
                        "
                        onmouseover="
                            this.style.transform = 'translateY(-2px)';
                            this.style.boxShadow =
                                '0 12px 25px rgba(102, 126, 234, 0.6)';
                        "
                        onmouseout="
                            this.style.transform = '';
                            this.style.boxShadow =
                                '0 8px 20px rgba(102, 126, 234, 0.4)';
                        "
                    >
                        Click to Start
                    </button>
                </div>
            </div>
            <div id="loading-screen" style="display: none">
                <div class="loading-content">
                    <h1 class="loading-title">Court Wizard</h1>
                    <img
                        src="logo.png"
                        alt="Loading"
                        class="spinner"
                        style="margin-top: 30px; animation: none"
                    />
                    <p class="loading-text" style="margin-top: 20px">
                        Loading<span class="dots"></span>
                    </p>
                </div>
            </div>
            <canvas id="bevy-canvas"></canvas>
        </div>

        <script type="module">
            // Store reference to AudioContext when it's created
            let audioContext = null;
            let audioContextResumed = false;

            // Intercept AudioContext creation BEFORE loading WASM
            const OriginalAudioContext =
                window.AudioContext || window.webkitAudioContext;
            if (OriginalAudioContext) {
                const AudioContextProxy = new Proxy(OriginalAudioContext, {
                    construct(target, args) {
                        // If we already created an AudioContext (after user click), return that
                        if (audioContext) {
                            console.log(
                                "WASM requested AudioContext, returning pre-created context, state:",
                                audioContext.state,
                            );
                            return audioContext;
                        }

                        // Otherwise create a new one (shouldn't happen with our start button)
                        audioContext = new target(...args);
                        console.log(
                            "AudioContext created by WASM (no pre-existing context), state:",
                            audioContext.state,
                        );
                        return audioContext;
                    },
                });
                window.AudioContext = AudioContextProxy;
                if (window.webkitAudioContext) {
                    window.webkitAudioContext = AudioContextProxy;
                }
            }

            // Resume AudioContext on ANY user interaction
            function resumeAudioContext() {
                if (
                    !audioContextResumed &&
                    audioContext &&
                    audioContext.state === "suspended"
                ) {
                    console.log(
                        "Resuming suspended AudioContext after user interaction...",
                    );
                    audioContext
                        .resume()
                        .then(() => {
                            console.log(
                                "AudioContext resumed! State:",
                                audioContext.state,
                            );
                            audioContextResumed = true;
                        })
                        .catch((err) => {
                            console.error(
                                "Failed to resume AudioContext:",
                                err,
                            );
                        });
                }
            }

            // Listen for ANY user interaction to resume audio
            document.addEventListener("click", resumeAudioContext);
            document.addEventListener("keydown", resumeAudioContext);
            document.addEventListener("touchstart", resumeAudioContext);

            import init from "./court_wizard.js";

            // Maintain 16:9 aspect ratio, constrained by both width and height
            function resizeCanvas() {
                const container = document.getElementById("canvas-container");
                const canvas = document.getElementById("bevy-canvas");

                const targetAspectRatio = 16 / 9;
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const windowAspectRatio = windowWidth / windowHeight;

                let canvasWidth, canvasHeight;

                if (windowAspectRatio > targetAspectRatio) {
                    // Window is too wide - constrain by height
                    canvasHeight = windowHeight;
                    canvasWidth = canvasHeight * targetAspectRatio;
                } else {
                    // Window is too tall - constrain by width
                    canvasWidth = windowWidth;
                    canvasHeight = canvasWidth / targetAspectRatio;
                }

                container.style.width = `${canvasWidth}px`;
                container.style.height = `${canvasHeight}px`;
                // Set canvas CSS size (not canvas internal resolution)
                canvas.style.width = `${canvasWidth}px`;
                canvas.style.height = `${canvasHeight}px`;
            }

            // Resize on load and window resize
            window.addEventListener("resize", resizeCanvas);
            resizeCanvas();

            // Get screen elements
            const startScreen = document.getElementById("start-screen");
            const loadingScreen = document.getElementById("loading-screen");
            const startButton = document.getElementById("start-button");

            // Wait for user to click start button before initializing WASM
            startButton.addEventListener("click", () => {
                console.log(
                    "User clicked start - creating AudioContext and initializing WASM...",
                );

                // Create AudioContext immediately after user gesture (before WASM init)
                const AudioContextConstructor =
                    window.AudioContext || window.webkitAudioContext;
                if (AudioContextConstructor && !audioContext) {
                    audioContext = new AudioContextConstructor();
                    console.log(
                        "AudioContext created after user click, state:",
                        audioContext.state,
                    );

                    // Resume if suspended
                    if (audioContext.state === "suspended") {
                        audioContext.resume().then(() => {
                            console.log(
                                "AudioContext resumed! State:",
                                audioContext.state,
                            );
                            audioContextResumed = true;
                        });
                    } else {
                        audioContextResumed = true;
                    }
                }

                // Hide start screen and show loading screen
                startScreen.classList.add("hidden");
                setTimeout(() => startScreen.remove(), 500);
                loadingScreen.style.display = "flex";

                // Now initialize WASM (will use our pre-created AudioContext via proxy)
                init()
                    .then(() => {
                        // Add hidden class to trigger fade-out transition
                        loadingScreen.classList.add("hidden");

                        // Remove from DOM after transition completes (500ms)
                        setTimeout(() => {
                            loadingScreen.remove();
                        }, 500);
                    })
                    .catch((error) => {
                        // Check for Bevy's control flow exception
                        if (
                            !error.message.startsWith(
                                "Using exceptions for control flow, don't mind me. This isn't actually an error!",
                            )
                        ) {
                            // Show error message in loading screen
                            loadingScreen.innerHTML = `
                            <div class="loading-content">
                                <h1 class="loading-title" style="color: rgb(255, 100, 100);">Error Loading Game</h1>
                                <p class="loading-text">${error.message}</p>
                                <p class="loading-text" style="margin-top: 20px; font-size: 16px;">Please refresh the page to try again.</p>
                            </div>
                        `;
                            throw error;
                        } else {
                            // Handle control flow exception as success
                            loadingScreen.classList.add("hidden");
                            setTimeout(() => {
                                loadingScreen.remove();
                            }, 500);
                        }
                    });
            });
        </script>
    </body>
</html>
